<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRISM — Assessment (Mobile)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Manrope', sans-serif;
      background: #ffffff;
      color: #0f172a;
    }
    header {
      position: sticky; top: 0; z-index: 40;
      border-bottom: 1px solid #e5e7eb;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
    }
    .nav { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px; }
    .logo { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 16px; }
    .logo img { width: 20px; height: 20px; border-radius: 4px; }
    .nav-actions { margin-left: auto; display: flex; gap: 6px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 8px; border: none; background: transparent;
      display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer;
    }
    .container { padding: 16px; }
    .progress { margin-bottom: 20px; }
    .progress-text { display: flex; justify-content: space-between; font-size: 12px; color: #64748b; margin-bottom: 8px; }
    .progress-bar { height: 6px; background: #f1f5f9; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: #0f172a; width: 10%; }

    .card {
      border: 1px solid #e5e7eb; border-radius: 14px; padding: 16px;
      background: white;
    }
    .card-header { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .card-subtitle { font-size: 13px; color: #64748b; margin-bottom: 16px; }

    .grid-2 { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .option-btn {
      padding: 14px; border: 1px solid #e5e7eb; border-radius: 10px;
      background: white; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500;
      text-align: center;
    }
    .option-btn.selected {
      border-color: #0f172a; background: rgba(15,23,42,0.05);
    }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
      background: #0f172a; color: white;
    }
    .btn:disabled { opacity: 0.5; }
    .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
    .btn-ghost {
      background: transparent; color: #0f172a; border: none; padding: 10px 12px;
      font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <div class="logo">
        <img src="prism_logo.png" alt="PRISM">
        <span>PRISM</span>
      </div>
      <div class="nav-actions">
        <button class="icon-btn">🌙</button>
        <button class="icon-btn">👤</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="progress">
      <div class="progress-text"><span>Step 1 of 11</span><span>9%</span></div>
      <div class="progress-bar"><div class="progress-fill"></div></div>
    </div>

    <div class="card">
      <div class="card-header">What type of system are you looking for?</div>
      <div class="card-subtitle">Select the category that best describes the software you need.</div>

      <div class="grid-2">
        <button class="option-btn">ERP</button>
        <button class="option-btn selected">CRM</button>
        <button class="option-btn">HRM</button>
        <button class="option-btn">POS</button>
        <button class="option-btn">Accounting</button>
        <button class="option-btn">Inventory Management</button>
        <button class="option-btn">Project Management</button>
        <button class="option-btn">Help Desk</button>
        <button class="option-btn">Other</button>
      </div>

      <div class="actions">
        <div></div>
        <button class="btn" disabled>Next →</button>
      </div>
    </div>
  </main>
</body>
</html>
